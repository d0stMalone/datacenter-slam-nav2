# Nav2 parameters for my_robot in the data hall.
#
# Started from nav2_bringup/params/nav2_params.yaml (Humble, tuned for a TurtleBot3).
# Every value changed for this robot/world is marked "# TUNED: reason".
# Explanations: docs/04-navigation.md
#
# Robot facts these numbers come from (urdf/my_robot.urdf.xacro):
#   base_link = midpoint of the drive axle (= rotation centre), NOT the body centre.
#   body extends x: -0.23 .. +0.13 m (camera at the front), y: -0.18 .. +0.18 m (wheels).
#   circumscribed radius (farthest corner from base_link) ~ 0.29 m.
# World facts: rack aisles are 1.2 m wide, so the robot centre is <= 0.6 m from a rack there.

amcl:
  ros__parameters:
    use_sim_time: True
    # --- Motion model: how much the particles are spread by each odometry step. ---
    # alpha1: rotation noise from rotation, alpha2: rotation noise from translation,
    # alpha3: translation noise from translation, alpha4: translation noise from rotation.
    alpha1: 0.1               # TUNED 0.2 -> 0.1: odometry is accurate since the sphere-wheel fix (<0.1 deg/90 deg)
    alpha2: 0.1               # TUNED
    alpha3: 0.1               # TUNED
    alpha4: 0.1               # TUNED
    alpha5: 0.2               # only used by the omni model
    base_frame_id: "base_link"        # TUNED: our URDF root (no separate base_footprint parent)
    global_frame_id: "map"
    odom_frame_id: "odom"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    tf_broadcast: true                # AMCL publishes map -> odom (replaces slam_toolbox)
    transform_tolerance: 1.0
    # --- Sensor model ---
    scan_topic: scan
    laser_model_type: "likelihood_field"
    laser_max_range: 12.0             # TUNED 100 -> 12: our lidar's real max range
    laser_min_range: 0.12             # TUNED -1 -> 0.12: our lidar's min range
    laser_likelihood_max_dist: 2.0
    max_beams: 60                     # 60 of the 360 beams per update: plenty, and cheap
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    # --- Particle filter ---
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_d: 0.2                 # TUNED 0.25 -> 0.2: update a bit more often in tight aisles
    update_min_a: 0.2
    save_pose_rate: 0.5
    # --- Initial pose ---
    # The map frame was created where the robot spawned (world -6.0, -5.2), so the default
    # spawn is exactly (0, 0, 0) in the map. AMCL starts localised; no clicking needed.
    # If you spawn elsewhere, use RViz "2D Pose Estimate" instead.
    set_initial_pose: true            # TUNED false -> true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Default behaviour trees (navigate_to_pose_w_replanning_and_recovery.xml):
    # replan at 1 Hz; on failure clear costmaps, spin, wait, back up, then retry.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5   # must move 0.5 m ...
      movement_time_allowance: 10.0   # ... every 10 s, else the BT starts recoveries
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15         # TUNED 0.25 -> 0.15: smaller robot, AMCL is accurate
      yaw_goal_tolerance: 0.2         # TUNED 0.25 -> 0.2

    # TUNED: Regulated Pure Pursuit instead of DWB.
    # Pure pursuit: chase a "carrot" point on the path a lookahead distance ahead, steering on
    # the arc that reaches it. "Regulated": slow down on tight curves and near obstacles
    # (high costmap cost), which is exactly what narrow rack aisles need. Path-following is
    # smooth and predictable; obstacle *avoidance* is left to the global planner's replanning.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4                 # m/s cruise speed (TB3 default would be 0.26)
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true  # lookahead = speed * lookahead_time, clamped
      rotate_to_heading_angular_vel: 0.8      # rad/s when turning on the spot
      transform_tolerance: 0.1
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6     # slow down over the last 0.6 m to the goal
      use_collision_detection: true           # check the footprint along the next arc
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true   # slow on tight curves
      use_cost_regulated_linear_velocity_scaling: true  # slow when close to obstacles
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      cost_scaling_dist: 0.4
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.5      # must match the costmaps' inflation layer
      use_rotate_to_heading: true             # diff drive: turn in place first if facing away
      rotate_to_heading_min_angle: 0.785      # ... when the path is > 45 deg off the heading
      allow_reversing: false
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom              # rolling window in odom: smooth, no AMCL jumps
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 4                        # TUNED 3 -> 4 m: see further at 0.4 m/s
      height: 4
      resolution: 0.05
      # TUNED: real rectangular footprint instead of robot_radius 0.22. base_link is near the
      # FRONT of the body, so a circle centred on it would be wrong at the back.
      footprint: "[[0.13, 0.18], [0.13, -0.18], [-0.23, -0.18], [-0.23, 0.18]]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]   # TUNED: 2D obstacle layer, 2D lidar needs no voxels
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0     # TUNED: clear free space out to the window edge
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5     # TUNED
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Local = SAFETY: a tight band used by the controller for collision checks and for
        # slowing down near racks. Must match FollowPath.inflation_cost_scaling_factor.
        cost_scaling_factor: 3.5      # TUNED 3.0 -> 3.5
        inflation_radius: 0.55
      # Keep-out zones (config/keepout_zones.yaml): applied on top of all layers.
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[[0.13, 0.18], [0.13, -0.18], [-0.23, -0.18], [-0.23, 0.18]]"   # TUNED
      footprint_padding: 0.02
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:                   # the saved SLAM map, from map_server
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:                 # live lidar: things not in the map (e.g. a person)
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0     # TUNED
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0     # TUNED
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Global = ROUTE SHAPE: a wide, gentle gradient so every free cell has a "distance from
        # obstacles" cost. In a 1.2 m aisle the two racks' gradients meet in a V-shaped valley
        # whose bottom is the exact centre line, so the path runs straight down the middle; in
        # open areas paths keep ~1 m from racks instead of skimming the inflation edge.
        # (With 0.55 m the aisle had a flat 10 cm zero-cost band and paths wobbled inside it.)
        cost_scaling_factor: 2.5      # TUNED 3.0 -> 2.5: slower fall-off = wider gradient
        inflation_radius: 1.0         # TUNED 0.55 -> 1.0
      # Keep-out zones (config/keepout_zones.yaml): applied on top of all layers.
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""                 # set by nav.launch.py's "map" argument

# ---- Keep-out zones (costmap filter) ----
# filter_mask_server: a second map_server that publishes the mask image (maps/datahall_keepout)
# costmap_filter_info_server: tells the costmaps which topic the mask is on and how to read it
filter_mask_server:
  ros__parameters:
    use_sim_time: True
    frame_id: "map"
    topic_name: "/keepout_filter_mask"
    yaml_filename: ""                 # set by nav.launch.py's "keepout_mask" argument

costmap_filter_info_server:
  ros__parameters:
    use_sim_time: True
    type: 0                           # 0 = keep-out filter (1 = speed limit, 2 = binary)
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0                         # cost = base + multiplier * mask value
    multiplier: 1.0

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0    # TUNED 20 -> 10: the BT asks for a new plan at 1 Hz anyway; silences "missed its rate"
    use_sim_time: True
    planner_plugins: ["GridBased"]
    # TUNED: Theta* instead of NavFn. Like A* on the grid, but when expanding a cell it checks
    # line of sight to its parent's parent and skips the middle cell if the straight line is
    # clear ("any-angle" search). Result: a few long straight segments instead of a
    # cell-by-cell staircase. Compared with NavFn on 4 test routes: up to 85 % less total
    # turning, centred in aisles (docs/04-navigation.md section 4).
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8             # 8-connected grid (diagonals allowed)
      w_euc_cost: 1.0                 # weight of path length ...
      w_traversal_cost: 2.0           # ... vs weight of costmap cost along it (stay away from racks)
      w_heuristic_cost: 1.0
      use_final_approach_orientation: false
      allow_unknown: true             # SLAM left a few unknown speckles inside aisles

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0           # TUNED 3.2 -> 2.0: matches controller/smoother

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# Sits between the controller (/cmd_vel_nav) and the robot (/cmd_vel): enforces speed and
# acceleration limits so the commands are physically reasonable (no wheel slip, see Phase 3).
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 1.0]     # TUNED 0.26 -> 0.4 m/s
    min_velocity: [-0.2, 0.0, -1.0]   # TUNED: slow reverse (BackUp recovery)
    max_accel: [1.0, 0.0, 2.0]        # TUNED 2.5/3.2 -> 1.0/2.0: gentle, no slip
    max_decel: [-1.0, 0.0, -2.0]      # TUNED
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
